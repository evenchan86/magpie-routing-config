<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">magpie-routing-config</title>
  <desc id="d">Two-layer routing blueprints for magpie, applied by your agent to your own models. A classifier dispatches each turn to one of eight task subgroups.</desc>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#53C8E8"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="26" fill="#0B0E11"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="25" fill="none" stroke="#2A323C" stroke-width="1.5"/>

  <!-- title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <circle cx="62" cy="72" r="6" fill="#53C8E8"/>
    <text x="80" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#53C8E8">ROUTING BLUEPRINTS · FOR MAGPIE</text>
    <text x="56" y="152" font-size="50" font-weight="700" fill="#F4F6F8">magpie-routing-config</text>
    <text x="56" y="204" font-size="24" fill="#F4F6F8">Your agent designs a two-layer routing config</text>
    <text x="56" y="238" font-size="24" fill="#8A94A0">from your own models. Your keys stay untouched.</text>
    <text x="56" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8A94A0">MIT · docs + templates + agent workflow · no real keys</text>
  </g>

  <!-- compact dispatch motif -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <rect x="860" y="64" width="150" height="34" rx="17" fill="#151A20" stroke="#2A323C" stroke-width="1.5"/>
    <text x="935" y="87" font-size="18" fill="#F4F6F8">your turn</text>
    <line x1="935" y1="98" x2="935" y2="122" stroke="#53C8E8" stroke-width="1.5" marker-end="url(#ah)"/>

    <rect x="840" y="126" width="190" height="44" rx="12" fill="#0F1418" stroke="#53C8E8" stroke-width="1.5"/>
    <text x="935" y="154" font-size="20" fill="#53C8E8">classifier</text>

    <line x1="935" y1="170" x2="795" y2="226" stroke="#53C8E8" stroke-width="1.5" opacity="0.7" marker-end="url(#ah)"/>
    <line x1="935" y1="170" x2="935" y2="226" stroke="#53C8E8" stroke-width="1.5" opacity="0.7" marker-end="url(#ah)"/>
    <line x1="935" y1="170" x2="1075" y2="226" stroke="#53C8E8" stroke-width="1.5" opacity="0.7" marker-end="url(#ah)"/>

    <rect x="739" y="230" width="112" height="40" rx="10" fill="#151A20" stroke="#2A323C" stroke-width="1.5"/>
    <text x="795" y="256" font-size="18" fill="#F4F6F8">g-code</text>
    <rect x="879" y="230" width="112" height="40" rx="10" fill="#151A20" stroke="#2A323C" stroke-width="1.5"/>
    <text x="935" y="256" font-size="18" fill="#F4F6F8">g-arch</text>
    <rect x="1019" y="230" width="112" height="40" rx="10" fill="#151A20" stroke="#2A323C" stroke-width="1.5"/>
    <text x="1075" y="256" font-size="18" fill="#F4F6F8">g-ui</text>

    <text x="935" y="306" font-size="18" fill="#8A94A0">1 classifier · 8 task subgroups</text>
  </g>
</svg>
